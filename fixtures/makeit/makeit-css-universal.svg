<svg xmlns="http://www.w3.org/2000/svg" width="40mm" height="40mm" viewBox="0 0 40 40">
  <!-- MakeIT CSS support test (#38), case 3: universal selector. The square is drawn black; red means MakeIT applied * {}. -->
  <style>
    * { stroke: #ff0000 }
  </style>
  <rect x="7.5" y="7.5" width="25" height="25" fill="none" stroke="#000000" stroke-width="0.5"/>
</svg>
