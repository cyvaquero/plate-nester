  <rect x="10" y="10" width="100" height="60" fill="none" stroke="#ff0000" stroke-width="0.2"/>
  <circle cx="60" cy="40" r="10" fill="none" stroke="#ff0000" stroke-width="0.2"/>
  <line x1="15" y1="65" x2="105" y2="65" stroke="#0000ff" stroke-width="0.2"/>
</svg>
