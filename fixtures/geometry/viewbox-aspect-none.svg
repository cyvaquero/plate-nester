<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="50mm" viewBox="0 0 100 100" preserveAspectRatio="none">
  <!-- viewBox aspect test (#65): same circle as viewbox-aspect-meet.svg, but preserveAspectRatio="none" stretches the
       viewBox to fill the box. Expected: a 100 x 50 mm ellipse (part size 100 x 50 mm). -->
  <circle cx="50" cy="50" r="50" fill="none" stroke="#ff0000" stroke-width="0.2"/>
</svg>
