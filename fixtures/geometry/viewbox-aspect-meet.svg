<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="50mm" viewBox="0 0 100 100">
  <!-- viewBox aspect test (#65): the square viewBox sits in a 100 x 50 mm box with no preserveAspectRatio, so the
       default "xMidYMid meet" scales it uniformly to fit. Expected: a 50 mm circle (part size 50 x 50 mm), not a
       100 x 50 mm ellipse. -->
  <circle cx="50" cy="50" r="50" fill="none" stroke="#ff0000" stroke-width="0.2"/>
</svg>
