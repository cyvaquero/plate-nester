<svg xmlns="http://www.w3.org/2000/svg" width="40mm" height="30mm" viewBox="0 0 40 30">
  <style>
    #fff { fill: none; stroke: #fff }
    rect.cafe, #cafe { stroke: #cafe; stroke-width: 0.3 }
    #abc > #bad { stroke: #bad }
    @media screen { #cafe { fill: none } }
  </style>
  <rect x="0.5" y="0.5" width="39" height="29" fill="none" stroke="#000" stroke-width="0.2"/>
  <rect id="fff" x="2" y="2" width="36" height="20" style="stroke:#fff"/>
  <circle id="cafe" cx="10" cy="12" r="4"/>
  <g id="abc"><circle id="bad" cx="25" cy="12" r="4" fill="none"/></g>
  <text x="2" y="27" font-size="4">#fff #cafe #bad</text>
</svg>
